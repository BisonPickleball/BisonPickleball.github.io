<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Global + Gallery Styles -->
    <link rel="stylesheet" href="../css/default.css">
    <link rel="stylesheet" href="../css/gallery.css">

    <title>Bison Pickleball</title>
    <link rel="icon" type="image/x-icon" href="../images/logo/favicon.png">
</head>

<body class="bg-light">

<div id="pagecontainer" class="mx-auto w-100">

    <!-- Banner -->
    <div id="banner" class="navbar-dark bg-dark w-100">
        <span class="d-sm-inline-block d-none w-100">
            <img style="max-width:1000px;" src="../images/logo/banner.png" class="w-100">
        </span>
    </div>

    <!-- Menu -->
    <nav class="navbar navbar-expand-sm navbar-dark bg-dark px-4">
        <a class="navbar-brand" href="#">
            <img id="logo" src="../images/logo/logo.png" class="d-inline-block d-sm-none">
        </a>
        <div>
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="../">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="./">Gallery</a></li>
                <li class="nav-item"><a class="nav-link" href="../contact/">Contact Us</a></li>
            </ul>
        </div>
    </nav>

    <br>

    <!-- Gallery Grid -->
    <div class="row" id="gallery" data-bs-toggle="modal" data-bs-target="#exampleModal"></div>

</div>

<!-- Fullscreen Modal -->
<div class="modal fade" id="exampleModal" tabindex="-1">
    <div class="modal-dialog modal-fullscreen">

        <div class="modal-content">

            <div class="modal-body">

                <!-- Close Button -->
                <button type="button"
                        class="btn-close position-absolute top-0 end-0 m-3"
                        data-bs-dismiss="modal"></button>

                <!-- Carousel -->
                <div id="carouselGallery" class="carousel slide" data-bs-interval="false">

                    <div class="carousel-inner"></div>

                    <!-- Controls -->
                    <button class="carousel-control-prev" type="button"
                            data-bs-target="#carouselGallery" data-bs-slide="prev">
                        <span class="carousel-control-prev-icon"></span>
                    </button>

                    <button class="carousel-control-next" type="button"
                            data-bs-target="#carouselGallery" data-bs-slide="next">
                        <span class="carousel-control-next-icon"></span>
                    </button>

                </div>
            </div>

        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/gallery.js"></script>

</body>
</html>
